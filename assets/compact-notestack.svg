  <text y="100" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#A9C2D6"><tspan x="24" dy="0">Keyboard-driven notes workspace</tspan><tspan x="24" dy="18">with a premium dark UI, single-</tspan><tspan x="24" dy="18">file frontend, zero build tools,</tspan><tspan x="24" dy="18">backed by a Flask REST API.</tspan></text>

