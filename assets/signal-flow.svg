<svg width="700" height="70" viewBox="0 0 700 70" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="line" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="680" y2="0">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <line x1="20" y1="35" x2="680" y2="35" stroke="url(#line)" stroke-width="2" stroke-dasharray="6 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/>
  </line>
  <g>
    <circle cx="60" cy="35" r="5" fill="#00E5FF"/>
    <text x="60" y="58" fill="#8FB4C9" font-size="11" font-family="Segoe UI, sans-serif" text-anchor="middle">SIGNAL</text>
  </g>
  <g>
    <circle cx="220" cy="35" r="5" fill="#00E5FF"/>
    <text x="220" y="58" fill="#8FB4C9" font-size="11" font-family="Segoe UI, sans-serif" text-anchor="middle">SYSTEM</text>
  </g>
  <g>
    <circle cx="380" cy="35" r="5" fill="#A78BFA"/>
    <text x="380" y="58" fill="#8FB4C9" font-size="11" font-family="Segoe UI, sans-serif" text-anchor="middle">CODE</text>
  </g>
  <g>
    <circle cx="520" cy="35" r="5" fill="#8B5CF6"/>
    <text x="520" y="58" fill="#8FB4C9" font-size="11" font-family="Segoe UI, sans-serif" text-anchor="middle">INTELLIGENCE</text>
  </g>
  <g>
    <circle cx="660" cy="35" r="6" fill="#8B5CF6">
      <animate attributeName="r" values="6;8;6" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="660" y="58" fill="#C4B5FD" font-size="11" font-family="Segoe UI, sans-serif" text-anchor="middle">PRODUCT</text>
  </g>
</svg>
