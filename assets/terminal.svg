    </linearGradient>
    <linearGradient id="tborder" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="600" y2="230">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.6"/>
