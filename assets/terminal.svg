  <rect x="1" y="1" width="598" height="228" rx="14" fill="url(#tbg)" stroke="url(#tborder)" stroke-width="1.5"/>

  <rect x="0" y="0" width="600" height="34" rx="14" fill="#11182B"/>
  <rect x="0" y="20" width="600" height="14" fill="#11182B"/>
  <circle cx="24" cy="17" r="6" fill="#FF5F56"/>
  <circle cx="46" cy="17" r="6" fill="#FFBD2E"/>
