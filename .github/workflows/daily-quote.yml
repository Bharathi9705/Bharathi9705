name: Daily Quote Update

on:
  schedule:
    # Runs at 3:30 UTC = 9:00 AM IST every day
    - cron: "30 3 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch quote and update README
        run: python scripts/update_quote.py

      - name: Commit and push if README changed
        run: |
          git config user.name "Bharathi9705"
          git config user.email "bharathi20061882@gmail.com"
          git add README.md assets/quote-card.svg
          if ! git diff --cached --quiet; then
            git commit -m "📝 Update quote of the day"
            git pull --rebase origin main && git push
          else
            echo "No changes to commit."
          fi
